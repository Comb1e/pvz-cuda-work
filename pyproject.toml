[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pvz-research-game"
version = "1.3.1"
description = "A deterministic daytime lawn-defense game with a standalone Python control API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cuda = ["cupy-cuda12x==13.6.0", "nvidia-cuda-runtime-cu12==12.8.90", "nvidia-cuda-nvrtc-cu12==12.8.93"]
ui = ["pygame-ce>=2.5,<3"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
pvz = "pvz_game.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pvz_game = ["data/*.toml", "cuda/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
